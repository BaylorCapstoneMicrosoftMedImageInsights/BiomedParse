# configs/finetune_biomedparse.yaml
defaults:
  - model: biomedparse
  - datamodule: biomedparse_finetune_datamodule
  - trainer: biomedparse_trainer
  - evaluator: biomedparse_evaluator
  - loss: biomedparse_loss
  - optimizer: adamw
  - olympus_checkpoint: biomedparse_checkpoint_loader
  - _self_

# Required Olympus root-level keys
mode: "train" 
external_mount: /home/medimage/medimage-inference-service/external_mount
experiment_output_dir: /home/medimage/medimage-inference-service/external_mount/outputs

mounts:
  external: ${external_mount}

# Explicitly map your processed JSON files
datamodule:
  datasets:
    _target_: azureml.acft.image.components.olympus.core.ModuleDatasets
    train:
      _target_: torch.utils.data.ConcatDataset
      _partial_: True
      datasets:
        - _target_: src.datasets.biomedparse_dataset.BiomedParseDataset
          root_dir: ${mounts.external}/data
          split: train
          img_size: [1024, 1024]
          interpolate_mask_size: [1024, 1024]
          all_class_masks: True
    validate:
      _target_: torch.utils.data.ConcatDataset
      _partial_: True
      datasets:
        - _target_: src.datasets.biomedparse_dataset.BiomedParseDataset
          root_dir: ${mounts.external}/data
          split: valid
          img_size: [1024, 1024]
          interpolate_mask_size: [1024, 1024]
          all_class_masks: True
  dataloaders:
    train:
      batch_size: 8
      num_workers: 1
    validate:
      batch_size: 8
      num_workers: 1

# 4090 Specific Optimizations
trainer:
  max_epochs: 10
  precision: 16-mixed
  devices: [0]
  accumulate_grad_batches: 2

optimizer:
  lr: 1e-5